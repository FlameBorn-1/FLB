[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
test = "test"
cache_path = "cache_forge"

# Optimizer settings (match Hardhat)
optimizer = true
optimizer_runs = 800
via_ir = false

# EVM version (match deployed contracts)
evm_version = "paris"

# Fuzz testing configuration
[fuzz]
runs = 5000
max_test_rejects = 100000
seed = '0x1'
dictionary_weight = 40
include_storage = true
include_push_bytes = true

# Invariant testing configuration
[invariant]
runs = 1000
depth = 100
fail_on_revert = true
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
shrink_run_limit = 5000

# RPC endpoints for forking
[rpc_endpoints]
sepolia = "${CELO_SEPOLIA_RPC_URL}"
alfajores = "${ALFAJORES_RPC_URL}"
mainnet = "${CELO_MAINNET_RPC_URL}"

# Solidity compiler version
solc_version = "0.8.28"

# Verbosity
verbosity = 2

# Gas reporting
gas_reports = ["*"]

# Coverage
[coverage]
exclude_paths = ["test", "node_modules"]
